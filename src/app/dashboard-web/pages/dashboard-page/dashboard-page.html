  <div class="app-shell" id="app">
    <!-- Sidebar: el contenido se genera desde js/data.js -->
<app-side-menu/>

    <div class="backdrop" id="backdrop"></div>

    <div class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <button type="button" class="icon-btn" id="menuToggle" aria-label="Alternar menú">
          <i class="bi bi-list fs-5"></i>
        </button>

        <div class="actions">
          <button type="button" class="icon-btn" id="themeToggle" aria-label="Cambiar tema"></button>

          <button type="button" class="icon-btn" aria-label="Notificaciones">
            <i class="bi bi-bell"></i>
            <span class="dot"></span>
          </button>

          <div class="user-chip">
            <button type="button" class="user-trigger" id="userToggle" aria-expanded="false" aria-controls="userMenu">
              <span class="avatar">AD</span>
              <span class="user-name">Administrador</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="user-menu" id="userMenu" hidden>
              <li><button type="button"><i class="bi bi-person"></i> Mi perfil</button></li>
              <li><button type="button"><i class="bi bi-gear"></i> Configuración</button></li>
              <li><button type="button"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Contenido: lo genera js/app.js según el hash de la URL (#/, #/calendario, ...) -->
      <main class="app-content" id="view">
         <router-outlet />
      </main>
    </div>
  </div>
